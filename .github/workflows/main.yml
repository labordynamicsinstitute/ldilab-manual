name: deploy-book

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    # If your git repository has the Jupyter Book within some-subfolder next to
    # unrelated files, you can make this run only if a file within that specific
    # folder has been modified.
    #
    # paths:
    # - some-subfolder/**

jobs:
  # Build the HTML book on every push and pull request, but only publish
  # it in the separate deploy job below.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip' # caching pip dependencies

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Upload built HTML
      uses: actions/upload-artifact@v5
      with:
        name: book-html
        path: ./_build/html

  # Build a PDF of the book and upload it as a downloadable artifact.
  # On a push to main, the deploy job publishes it alongside the HTML
  # as printable-version.pdf; on other runs it's only a workflow artifact.
  build-pdf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip' # caching pip dependencies

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install playwright
        playwright install --with-deps chromium

    - name: Build the PDF (HTML-to-PDF via playwright/Chromium)
      run: |
        jupyter-book build . --builder pdfhtml
        mv _build/pdf/book.pdf _build/pdf/printable-version.pdf
      continue-on-error: true

    - name: Upload built PDF
      uses: actions/upload-artifact@v5
      with:
        name: book-pdf
        path: ./_build/pdf
        if-no-files-found: warn

  # Push the book's HTML (plus the printable PDF) to github-pages. Only
  # runs for pushes to main, so pull requests and other branches build
  # without deploying.
  deploy:
    needs: [build, build-pdf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Download built HTML
      uses: actions/download-artifact@v5
      with:
        name: book-html
        path: ./_build/html

    - name: Download built PDF
      uses: actions/download-artifact@v5
      continue-on-error: true
      with:
        name: book-pdf
        path: ./_build/html

    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.6.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/html

  # Deploy a live per-PR preview to Cloudflare Pages, for pull requests
  # opened from a branch of this repository (not a fork -- forks can't
  # read deploy secrets). Posts (or updates) the preview link as a PR
  # comment. See README-DEPLOYMENT.md for the one-time Cloudflare setup.
  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # only for the PR comment
    steps:
    - name: Download built HTML
      uses: actions/download-artifact@v5
      with:
        name: book-html
        path: ./_build/html

    - name: Deploy PR preview
      id: preview
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >-
          pages deploy ./_build/html
          --project-name=${{ github.event.repository.name }}
          --branch=pr-${{ github.event.pull_request.number }}

    - name: Publish preview link
      if: steps.preview.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
      run: |
        echo "📖 Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
        gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
          --body "📖 **Preview:** $URL — commit \`${GITHUB_SHA:0:7}\`"
